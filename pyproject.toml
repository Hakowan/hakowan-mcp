[build-system]
requires = ["flit_core>=3.11,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "hakowan-mcp"
authors = [{name = "Qingnan Zhou", email = "qnzhou@gmail.com"}]
license = {file = "LICENSE"}
readme = "README.md"
dynamic = ["description", "version"]
requires-python = ">=3.11"
dependencies = [
    "hakowan>=0.6.0,<0.7",
    "mcp>=2,<3",
    "pydantic>=2.10,<3",
]

[project.scripts]
hakowan-mcp = "hakowan_mcp.__main__:main"
hakowan-mcp-eval = "hakowan_mcp.eval.runner:main"

[project.optional-dependencies]
observe = ["hakowan[observe]>=0.6.0,<0.7"]
data = ["hakowan[data]>=0.6.0,<0.7"]
dev = [
    "hakowan[observe]>=0.6.0,<0.7",
    "pytest>=9,<10",
    "ruff>=0.12,<0.13",
    "mypy>=1.19,<1.20",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
hakowan-mcp = {path = ".", editable = true}
hakowan = {path = "../hakowan", editable = true}

[tool.pixi.dependencies]
python = ">=3.11,<3.14"
pytest = ">=9,<10"
ruff = ">=0.12,<0.13"
mypy = ">=1.19,<1.20"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]

[tool.mypy]
python_version = "3.13"
files = ["src/hakowan_mcp"]
ignore_missing_imports = true
